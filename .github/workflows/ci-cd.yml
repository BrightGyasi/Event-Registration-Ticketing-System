name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Runs on every push and every PR: fast feedback, no AWS credentials used.
  # -----------------------------------------------------------------------
  test:
    name: Lint & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Unit tests with coverage
        run: pytest tests/ -v --maxfail=1

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --lint

      - name: SAM build (smoke test packaging)
        run: sam build

  # -----------------------------------------------------------------------
  # Deploys to the prod stage automatically on every merge to main.
  # Uses short-lived credentials via GitHub's OIDC provider — no static
  # AWS access keys stored as secrets.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to AWS (prod)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: SAM build
        run: sam build --use-container

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name event-ticketing-prod \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Stage=prod \
              AlertEmail=${{ secrets.ALERT_EMAIL }} \
              MonthlyBudgetLimit=10 \
              EnableConfirmationEmails=true

      - name: Post-deploy smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name event-ticketing-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          echo "Checking $API_URL events endpoint responds..."
          status=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}events")
          if [ "$status" != "200" ]; then
            echo "Smoke test failed: got HTTP $status"
            exit 1
          fi
          echo "Smoke test passed."
